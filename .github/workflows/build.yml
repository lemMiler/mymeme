name: Build and ABI-test Windows DLL

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "src/**"
      - "resources/**"
      - "tools/**"
      - "config.example.toml"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "Cargo.toml"
      - "rust-toolchain.toml"
      - "src/**"
      - "resources/**"
      - "tools/**"
      - "config.example.toml"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # IMPORTANT: Rust has no stable ABI. External meme libraries must use the
      # same compiler generation as meme-generator-rs. Do NOT replace this with
      # `stable`; doing so can produce a DLL that loads but crashes the process.
      - name: Install pinned Rust 1.93.1
        shell: pwsh
        run: |
          rustup toolchain install 1.93.1 --profile minimal
          rustup target add x86_64-pc-windows-msvc --toolchain 1.93.1
          rustup override set 1.93.1
          $v = rustc --version
          Write-Host "rustc: $v"
          if ($v -notmatch '^rustc 1\.93\.1 ') {
            throw "Wrong rustc version: $v"
          }

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Setup Python for ABI smoke test
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate image resources
        run: python tools/validate_resources.py
        env:
          # Windows runner 控制台是 GBK/CP1252，打印 emoji（✅/❌）会抛
          # UnicodeEncodeError，强制 Python 以 UTF-8 输出。
          PYTHONIOENCODING: utf-8

      - name: Cargo check
        run: cargo +1.93.1 check --target x86_64-pc-windows-msvc

      - name: Build release DLL
        run: cargo +1.93.1 build --release --target x86_64-pc-windows-msvc

      - name: Install exact Python host binding
        run: python -m pip install --disable-pip-version-check "meme-generator==0.2.3"

      - name: Stage isolated MEME_HOME for runtime test
        shell: pwsh
        run: |
          $smoke = (Resolve-Path ".").Path + "\.ci_meme_home"
          Remove-Item $smoke -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$smoke\libraries" | Out-Null
          New-Item -ItemType Directory -Force "$smoke\resources\images" | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\memelite_custom_memes.dll" "$smoke\libraries\"
          Copy-Item "resources\images\*" "$smoke\resources\images\" -Recurse -Force
          @(
            "[meme]",
            "load_builtin_memes = false",
            "load_external_memes = true"
          ) | Set-Content -Path "$smoke\config.toml" -Encoding utf8
          "MEME_HOME=$smoke" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Smoke MEME_HOME: $smoke"

      # This is deliberately a separate Python process. If an ABI mismatch
      # triggers a native access violation, the step exits non-zero and no
      # artifact is published.
      - name: Runtime ABI smoke test (load + real generation)
        run: python tools/runtime_smoke_test.py

      - name: Stage install package
        shell: pwsh
        run: |
          $stage = "dist/MEME_HOME"
          Remove-Item "dist" -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$stage/libraries" | Out-Null
          New-Item -ItemType Directory -Force "$stage/resources/images" | Out-Null
          Copy-Item "target/x86_64-pc-windows-msvc/release/memelite_custom_memes.dll" "$stage/libraries/"
          Copy-Item "resources/images/*" "$stage/resources/images/" -Recurse -Force
          Copy-Item "config.example.toml" "$stage/config.example.toml"
          @(
            "meme-generator target: 0.2.3",
            "rustc target: 1.93.1",
            "target: x86_64-pc-windows-msvc",
            "runtime smoke test: PASSED"
          ) | Set-Content "$stage/BUILD_INFO.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/memelite_custom_memes-windows-x64.zip" -Force

      - name: Upload install package only after ABI test passes
        uses: actions/upload-artifact@v6
        with:
          name: memelite-custom-memes-windows-x64-abi-tested
          path: dist/memelite_custom_memes-windows-x64.zip
          if-no-files-found: error
